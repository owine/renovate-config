# frozen fixture — do not bump. Mirrors owine/unifi-network-mcp and
# owine/unifi-protect-mcp: one annotated LTS lane per line. Before #108 this
# extracted a THIRD, phantom dep (node-lts-22 @ 24.21.0) because the
# leading-comment pattern re-read line 1's trailing annotation and paired it
# with line 2's value.
name: ci
on: [push]
jobs:
  test:
    strategy:
      matrix:
        node-version:
          - '22.23.2' # renovate: datasource=node-version depName=node-lts-22 packageName=node
          - '24.21.0' # renovate: datasource=node-version depName=node-lts-24 packageName=node
    steps:
      - run: node --version
