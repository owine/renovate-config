name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  renovate-config-validator:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Validate against the same engine Mend-hosted runs (the Docker image tracks
    # real releases; the npm package lags ~35 minors behind). Renovate's native
    # github-actions manager updates this tag and the default.json pinDigests
    # rule appends the digest, so the self-update loop needs no custom manager.
    # User=12021 in the image would block actions/checkout writing the
    # workspace, so run the job container as root.
    container:
      image: ghcr.io/renovatebot/renovate:44.186.1@sha256:df2c48fa96d28eaa9151829b33e6e84e98c640ae9a1052e10fd5636e1a092a21
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Behavior gate. The validator below is a SCHEMA check and cannot tell a
      # working customManager regex from a broken one — #108 shipped a phantom
      # dep to every consumer with validation green. This runs the real
      # extractor and the real auto-replacer out of the image's own Renovate
      # install against committed fixtures, so it needs no toolchain of its own.
      - name: Test customManager behavior
        run: node test/custom-managers.mjs

      # Same engine, package-rule side: an exact `requires-python` pin must
      # stay tracked by the native pep621 manager and grouped with its base
      # image, and every other `requires-python` shape must stay disabled. The
      # release-age soak must not drop either half from the shared branch.
      - name: Test python runtime behavior
        run: node test/python-runtime.mjs

      # A branch takes ONE commit type and `ci`/`chore` outrank `deps`, so a
      # group that mixes them silently drops releases (unifi-protect-mcp
      # #284). Asserts the CI and dev groups mirror the rules that assign
      # those types, and that no group carries two types.
      - name: Test commit-type grouping
        run: node test/commit-types.mjs

      # Consumers on release-drafter read that commit type back out of the
      # squash-merged PR title. Asserts the shared release-drafter.yml shows
      # every type the presets release on (`deps`, `fix`) and pre-excludes
      # the hidden ones (`ci`, `chore`).
      - name: Test release-drafter categories
        run: node test/release-drafter.mjs

      # Every consumer runs a copy of scripts/release-summary.js after
      # release-drafter; nothing here runs it for real. Runs it the way
      # actions/github-script does, against a mock octokit: it must count only
      # the changes above the compare line and write only to a draft.
      - name: Test release summary script
        run: node test/release-summary.mjs

      - name: Validate Renovate presets
        run: |
          renovate-config-validator --strict \
            renovate.json \
            default.json \
            automerge.json \
            node.json \
            python.json \
            docker.json \
            mcp.json \
            alpine.json \
            home-assistant.json
