name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  renovate-config-validator:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Validate against the same engine Mend-hosted runs (the Docker image tracks
    # real releases; the npm package lags ~35 minors behind). Renovate's native
    # github-actions manager updates this tag and the default.json pinDigests
    # rule appends the digest, so the self-update loop needs no custom manager.
    # User=12021 in the image would block actions/checkout writing the
    # workspace, so run the job container as root.
    container:
      image: ghcr.io/renovatebot/renovate:44.155.1@sha256:f5796f26088c0f5debb07c16fa9e801145e4d3ba9717d9cc22ca8cd265e2a0eb
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Behavior gate. The validator below is a SCHEMA check and cannot tell a
      # working customManager regex from a broken one — #108 shipped a phantom
      # dep to every consumer with validation green. This runs the real
      # extractor and the real auto-replacer out of the image's own Renovate
      # install against committed fixtures, so it needs no toolchain of its own.
      - name: Test customManager behavior
        run: node test/custom-managers.mjs

      # Same engine, package-rule side: an exact `requires-python` pin must
      # stay tracked by the native pep621 manager and grouped with its base
      # image, and every other `requires-python` shape must stay disabled.
      - name: Test python runtime behavior
        run: node test/python-runtime.mjs

      - name: Validate Renovate presets
        run: |
          renovate-config-validator --strict \
            renovate.json \
            default.json \
            automerge.json \
            node.json \
            python.json \
            docker.json \
            mcp.json \
            alpine.json \
            home-assistant.json
